# Checks every pull request and every push to main, on Linux, so
# everything builds; nothing here needs a secret (README.md, "Continuous
# integration"):
#
#   vet         gofmt and go vet (make vet), and staticcheck
#   test        the whole test suite with restic (so the backup tests run
#               rather than skip), and the package editor's JavaScript tests
#   help        the help site's strict build (make help), so a broken link
#               fails a pull request, not only a release
#   generated   the files Python generates are up to date
#   lint        shellcheck on every script, and actionlint on the workflows
#   govulncheck also weekly on main, as new vulnerabilities are published
#               in code that hasn't changed
#
# The tools' versions are in .github/versions.env, which each job reads
# first. Actions are pinned by commit, with the release in a comment:
# update both together (Dependabot proposes both, .github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 03:17 UTC (off the hour, when GitHub is less busy).
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt and go vet
        run: make vet
      # The default checks less ST1005 (staticcheck.conf).
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION" ./...

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Get restic
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/restic.bz2" \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "$RESTIC_SHA256  $RUNNER_TEMP/restic.bz2" | sha256sum -c -
          bunzip2 "$RUNNER_TEMP/restic.bz2"
          chmod +x "$RUNNER_TEMP/restic"
          "$RUNNER_TEMP/restic" version
          echo "ROOSTACK_RESTIC_BIN=$RUNNER_TEMP/restic" >> "$GITHUB_ENV"
      # The restic-backed tests skip without ROOSTACK_RESTIC_BIN (CLAUDE.md);
      # it's set above, so here they run.
      - name: go test
        run: go test ./...
      # The package editor's checks against Go's, and its import (SPEC.md
      # §8.3.7), with the runner image's own Node (20 or later).
      - name: node --test (the package editor)
        run: node --version && make editor-test

  # The help site as a release builds it: Zensical exactly as help/uv.lock
  # pins it (refusing a lock that's out of date), strict, so a broken link
  # or a missing page fails.
  help:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - name: Get uv
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      # make help only warns without uv; here it must build.
      - name: make help
        run: uv --version && make help

  # The files Python generates (CONTRIBUTING.md, "Regenerating files"),
  # made again and compared with what's committed. The ones Go generates
  # fail go test when they're out of date. The error scenes' script runs
  # gofmt; the brand's needs rsvg-convert for the PNG and ICO files
  # (Ubuntu 24.04's 2.58 writes them byte for byte as Homebrew's does).
  generated:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Get rsvg-convert
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librsvg2-bin
          rsvg-convert --version
      - name: Generate them again
        run: |
          python3 --version
          python3 assets/errors/generate.py
          python3 assets/brand/generate.py
      - name: Nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff --stat
            echo "::error::A generated file is out of date: run the scripts above and commit what they change (CONTRIBUTING.md, \"Regenerating files\")"
            exit 1
          fi

  # Every shell script (by name or by its #! line) with a pinned
  # shellcheck, then the workflows with actionlint, which checks the shell
  # in them with the same shellcheck.
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - name: Get shellcheck
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: shellcheck
        run: |
          shellcheck --version
          scripts=()
          while IFS= read -r -d '' f; do
            if [[ $f == *.sh ]] || head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)'; then
              scripts+=("$f")
            fi
          done < <(git ls-files -z)
          echo "${#scripts[@]} scripts"
          shellcheck "${scripts[@]}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: grep -E '^[A-Z0-9_]+=' .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Fails only on a vulnerability the code can reach.
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
