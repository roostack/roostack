# Checks every pull request and every push to main: gofmt and go vet
# (make vet), the whole test suite with restic (so the backup tests run
# rather than skip), and govulncheck. On Linux, so everything builds;
# nothing here needs a secret (README.md, "Continuous integration").
#
# Actions are pinned by commit, with the release in a comment: update
# both together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Go CI builds and tests with. go.mod names only the oldest Go
  # Roostack supports (1.26); this is the one Cloud pins, the first with
  # fixes for the standard library's published vulnerabilities (Cloud's
  # docs/REVIEW-2026-10-16.md), so govulncheck's findings are about it.
  GO_VERSION: "1.27.2"
  # Debian 13's restic (docs/ASSUMPTIONS.md L9), from restic's release,
  # checked against the SHA-256 in its SHA256SUMS.
  RESTIC_VERSION: "0.18.0"
  RESTIC_SHA256: 98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt and go vet
        run: make vet

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Get restic
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/restic.bz2" \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "$RESTIC_SHA256  $RUNNER_TEMP/restic.bz2" | sha256sum -c -
          bunzip2 "$RUNNER_TEMP/restic.bz2"
          chmod +x "$RUNNER_TEMP/restic"
          "$RUNNER_TEMP/restic" version
          echo "ROOSTACK_RESTIC_BIN=$RUNNER_TEMP/restic" >> "$GITHUB_ENV"
      # The restic-backed tests skip without ROOSTACK_RESTIC_BIN (CLAUDE.md);
      # it's set above, so here they run.
      - name: go test
        run: go test ./...

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Fails only on a vulnerability the code can reach.
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...
