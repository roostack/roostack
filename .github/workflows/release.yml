# Builds and signs a Roostack release when a tag like v1.2.3 is pushed
# (docs/RELEASING.md):
#
# 1. check: the tag is on main and is what git describe says, the release
#    key in packaging/keys is a real one, and govulncheck finds nothing.
# 2. build: scripts/build-release.sh, twice, on two runners in two
#    folders, in a pinned Debian 13 image: both .debs, both plain
#    binaries, SHA256SUMS.
# 3. compare: the two builds must be identical, byte for byte.
# 4. sign: SHA256SUMS.asc, with the signing subkey from the `release`
#    environment (it waits for a reviewer), checked with gpgv against the
#    committed public key. Everything goes on as the artifact
#    `release-files`.
# 5. publish: apt-publish.yml takes `release-files` and publishes them at
#    dl.roostack.cloud and in the apt repository.
#
# Actions are pinned by commit, with the release in a comment: update
# both together.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One release at a time for each tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Go releases are built with: scripts/build-release.sh's GO_RELEASE
  # (which makes the go tool fetch it if this one differs) and ci.yml's.
  GO_VERSION: "1.27.2"
  GOVULNCHECK_VERSION: v1.9.0
  # uv, which builds the help site with the Zensical in help/uv.lock,
  # from uv's release, checked against the SHA-256 in its .sha256 file.
  # The aarch64 one is for rebuilding on an ARM machine
  # (scripts/verify-release.sh reads these).
  UV_VERSION: "0.12.22"
  UV_SHA256: b9980552309f09c15172b8be828555e375097f16deb459795ce7bfd200380f0b
  UV_SHA256_AARCH64: 6f66a14e8239871fb477f9746c941fedfa77e8fe28a8bc7c07e1dc7f53a66712

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      # The release's version: the tag without its v (v1.2.3 → 1.2.3).
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only a release of reviewed code: the tag's commit is on main, and
      # the tag is the one git describe gives (as the build checks again).
      - name: The tag is on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
            { echo "::error::$TAG isn't a release tag (v1.2.3)"; exit 1; }
          [[ $(git describe --tags) == "$TAG" ]] ||
            { echo "::error::git describe says $(git describe --tags), not $TAG: one release tag per commit"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG isn't on main: release only merged, reviewed code"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: The release key is a real one
        run: scripts/sign-release.sh --check-key
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  # Two builds, to show the release is reproducible: separate runners,
  # and a different folder for each, so a path or anything else from the
  # machine that slipped into the output shows up as a difference.
  build:
    needs: check
    runs-on: ubuntu-24.04
    # Debian 13, the system Roostack runs on, pinned by digest: its
    # dpkg-deb and xz make the .debs, so anyone can rebuild them in the
    # same image and get the same bytes (docs/RELEASING.md).
    container:
      image: docker.io/library/debian:trixie-20261005-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    strategy:
      matrix:
        include:
          - copy: first
            path: roostack
          - copy: second
            path: elsewhere/another-roostack
    steps:
      # git before the checkout, which otherwise downloads the files
      # without their history (git describe needs it).
      - name: Get the build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates curl git make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: ${{ matrix.path }}
      # No cache: a release is built from nothing but its source, so
      # nothing another workflow saved can reach it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Get uv
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "$UV_SHA256  $RUNNER_TEMP/uv.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      # Never a development build: ROOSTACK_DEV_BUILD and REGISTRY_DEV_KEY
      # stay unset, so build-deb.sh refuses without the registry's real
      # root key (docs/REGISTRY-KEYS.md).
      - name: Build
        working-directory: ${{ matrix.path }}
        env:
          ROOSTACK_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.copy }}
          path: ${{ matrix.path }}/dist/release/
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-first
          path: first
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-second
          path: second
      - name: Both builds are the same
        run: |
          (cd first && sha256sum -c --strict SHA256SUMS)
          (cd second && sha256sum -c --strict SHA256SUMS)
          if ! diff -u first/SHA256SUMS second/SHA256SUMS; then
            echo "::error::The two builds differ, so this release isn't reproducible: compare them with diffoscope (docs/RELEASING.md)"
            exit 1
          fi
          diff -r first second
          cat first/SHA256SUMS

  sign:
    needs: compare
    runs-on: ubuntu-24.04
    # The signing subkey is this environment's secret; the environment
    # waits for a reviewer and allows only v* tags (docs/RELEASING.md).
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-first
          path: release
      - name: Sign SHA256SUMS
        env:
          ROOSTACK_RELEASE_SIGNING_KEY: ${{ secrets.ROOSTACK_RELEASE_SIGNING_KEY }}
        run: |
          (cd release && sha256sum -c --strict SHA256SUMS)
          scripts/sign-release.sh release
      # What apt-publish.yml takes: the .debs, the binaries, SHA256SUMS
      # and SHA256SUMS.asc, flat.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 90

  # Its own job in the `release` environment, which holds the bucket's
  # keys and the signing subkey (for the apt repository's InRelease).
  publish:
    needs: [check, sign]
    uses: ./.github/workflows/apt-publish.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
