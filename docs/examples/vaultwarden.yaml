# Reference example: simple package (single container, SQLite).
# Image digests looked up 2026-09-26. See SPEC.md §8.1.
schema: roostack/v1alpha1
name: vaultwarden
title: Vaultwarden
description: Password manager compatible with the Bitwarden apps
version: 1.34.3-roostack.1          # upstream version + package revision

about:                           # the project, credited in the catalog (SPEC §8.3.6)
  maker: Daniel García and volunteer maintainers
  source: https://github.com/dani-garcia/vaultwarden
  licence: AGPL-3.0-only         # SPDX, from its Cargo.toml
  support: https://github.com/sponsors/dani-garcia
  icon: vaultwarden.png          # beside this file
  categories: [passwords]
  keywords: [password manager, bitwarden, two-factor, passkeys]
requires:
  roostack: "0.1"                # the oldest Roostack that can run it

settings:                        # shown in the UI at install and in settings
  - key: signups_allowed
    title: Allow anyone to create an account
    type: bool
    default: false
  - key: admin_token
    title: Admin token
    description: Needed to open Vaultwarden's admin panel
    type: secret
    generate: true               # Roostack creates it; stored as a Podman secret
    reveal: true                 # shown to Admins on request, for the admin panel

containers:
  app:
    image: docker.io/vaultwarden/server:1.34.3@sha256:84fd8a47f58d79a1ad824c27be0a9492750c0fa5216b35c749863093bfa3c3d7
    env:
      DOMAIN: "{{ .Routes.web.URL }}"
      SIGNUPS_ALLOWED: "{{ .Settings.signups_allowed }}"
    secrets:
      ADMIN_TOKEN: admin_token
    mounts:
      - { storage: data, path: /data }
    health:
      http: { port: 80, path: /alive }
    memory: 50 MB                # typical use, for the install summary

storage:
  data:
    title: Passwords, accounts and settings
    class: critical              # backed up by default

databases:
  main:
    type: sqlite                 # Roostack handles consistent backups itself
    path: data/db.sqlite3

links:                           # most settings live in the app itself
  - title: Admin panel
    description: Users, invitations, email and other Vaultwarden settings (asks for the admin token)
    route: web
    path: /admin

routes:
  web:
    container: app
    port: 80
    subdomain: vault             # default; user can change it
    exposure: private            # default; user can make it public
    public:                      # when it is public (SPEC §6.11)
      private_paths:
        - path: /admin
          reason: Vaultwarden's admin panel, which changes the server's settings and every account. Anyone who guesses or steals the admin token could use it.
      login_paths:               # strict rate limit for outside visitors
        - /identity/connect/token
        - /api/accounts/prelogin

# --- Matching instance (desired state) ---
# /var/lib/roostack/services/vaultwarden.yaml
#
# package: vaultwarden
# version: 1.34.3-roostack.1
# routes:
#   web: { subdomain: passwords, exposure: private }
# settings:
#   signups_allowed: false
# updates: minor                 # notify | patch | minor | all
#
# --- Generated output ---
# ~/.config/containers/systemd/roostack-vaultwarden-app.container
# ~/.config/containers/systemd/roostack-vaultwarden.network
# /var/lib/roostack/caddy/sites/vaultwarden.caddy
# /srv/roostack/services/vaultwarden/data/
