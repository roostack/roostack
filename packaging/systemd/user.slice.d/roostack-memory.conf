# From the roostack package (SPEC.md §6.1, "Memory"): the kernel honours
# a slice's MemoryLow only as far as every slice above it has as much, so
# user.slice keeps enough for Caddy's (96M), in the roostack user's
# manager. The package writes the same for user-<uid>.slice and
# user@<uid>.service, which have the roostack user's UID in their names.
[Slice]
MemoryLow=96M
