# From the roostack package (SPEC.md §6.1, "Memory"): turns on zswap, which
# keeps memory moved out to swap compressed in memory first, so reading it
# back is mostly a decompression rather than a disk read, for a little
# processor time. At every boot, and once when the package is installed.
# To keep zswap off, put an empty /etc/tmpfiles.d/roostack-zswap.conf in
# its place.
w- /sys/module/zswap/parameters/enabled - - - - Y
