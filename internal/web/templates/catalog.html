{{define "title"}}Add a service{{end}}
{{define "content"}}
<section>
  {{back "/" "Your services"}}
  <h1>Add a service</h1>
  <ul class="services">
    {{range .Items}}
    <li class="card service">
      <div>
        <h2>{{.Title}}</h2>
        <p class="hint">{{.Description}}</p>
      </div>
      {{if .Installed}}{{badge "Installed"}}
      {{else}}<a class="button" href="/install/{{.Name}}">Install</a>{{end}}
    </li>
    {{else}}
    <li class="card">The catalog is empty.</li>
    {{end}}
  </ul>
</section>
{{end}}
