{{define "title"}}Two-factor code{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>Enter your code</h1>
  <p>Open your authenticator app and enter the 6-digit code for Roostack.</p>
  {{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login/totp">
    <label>Code
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" required autofocus>
    </label>
    <button type="submit">Continue</button>
  </form>
</section>
{{end}}

{{define "page-help"}}{{help "trouble/locked-out#you-lost-your-phone-two-factor" "Lost your phone?"}}{{end}}
