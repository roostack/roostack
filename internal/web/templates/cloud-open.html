{{define "title"}}Roostack Cloud{{end}}
{{define "head"}}{{with .OpenURL}}<meta http-equiv="refresh" content="0;url={{.}}">{{end}}{{end}}
{{define "content"}}
<section class="card narrow">
  {{if .OpenURL}}
  <h1>Opening Roostack Cloud…</h1>
  <p>If it doesn't open, <a href="{{.OpenURL}}">go to Roostack Cloud</a>.</p>
  {{else}}
  <h1>Roostack Cloud didn't open</h1>
  <p class="error" role="alert">{{.Error}}</p>
  <p>Close this window and try again.</p>
  {{end}}
</section>
{{end}}
