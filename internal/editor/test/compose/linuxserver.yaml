# The LinuxServer.io shape: PUID, TZ, /config, read-only media.
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.7
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5
    volumes:
      - /path/to/jellyfin/library:/config
      - /path/to/tvseries:/data/tvshows:ro
      - /path/to/movies:/data/movies:ro
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
